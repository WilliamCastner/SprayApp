name: namer_app
description: "Spray wall climbs for FA Humboldt."
publish_to: "none"
version: 0.5.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

  supabase_flutter: ^2.9.1
  uuid: ^4.4.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  video_compress: ^3.1.3
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spray_wall_v2.jpg
    - assets/spray_wall_v2_preview.jpg
    - assets/FA_logo.png
    - assets/google_fonts/

flutter_launcher_icons:
  remove_alpha_ios: true
  ios: true
  image_path: "assets/FA_logo.png"
